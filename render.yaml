# Render Blueprint: one web service runs the Express API and serves the built React app.
# Postgres is hosted on Neon; its connection string is set as DATABASE_URL in the Render dashboard.
services:
  - type: web
    name: salary-management
    runtime: node
    plan: free
    region: singapore
    buildCommand: >-
      npm ci --prefix backend &&
      npm ci --prefix frontend &&
      npm run build --prefix frontend &&
      npm run build --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false