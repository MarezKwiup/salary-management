services:
  db: 
    image: postgres:16
    container_name: salary_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salary_dev
    ports:
      - "5432:5432"
    volumes:
      - salary_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salary_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  db_test:
    image: postgres:16
    container_name: salary_db_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salary_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salary_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  salary_dev_data: